spring.application.name=gestor-inversores

# --- Configuraciones de Seguridad ---
spring.security.user.name=${APP_ADMIN_USER:lucas}
spring.security.user.password=${APP_ADMIN_PASSWORD:1234}

# --- Configuraciones de BD ---
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gestor_inversores?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuraciones de JWT ---
security.jwt.private.key=${JWT_SECRET_KEY:ebd0fa26534e4af21e88da31d0c9f4307d974d1f79b8b58a57a00367b158e0fd}
security.jwt.user.generator=${JWT_USER_GENERATOR:PROYPLUS202-SEC}

# --- Configuracion de Mail (Gmail) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- API Keys Externas ---
exchangerate.api.key=${EXCHANGE_RATE_API_KEY:your-exchange-rate-api-key}
google.gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key}

# --- Archivos ---
app.upload.dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB