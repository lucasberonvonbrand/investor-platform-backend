<div class="navbar bg-[#090f1d] border-b border-[#1e293b] px-6 h-16 sticky top-0 z-50 text-white">
  <div class="flex-1">
    <a class="flex gap-2 items-center hover:opacity-90 transition-opacity" routerLink="/projects/catalog">
      <img src="assets/images/ProyplusTransparente.png" alt="Proy+" class="h-14 w-auto invert object-contain" />
    </a>
  </div>
  <div class="flex-none gap-3">

    <!-- 👤 User Profile Menu -->
    <div class="dropdown dropdown-end" *ngIf="currentUser()">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar placeholder bg-[#0d1527] border border-[#1e293b] hover:border-[#7c3aed] transition">
        <div class="bg-[#7c3aed] text-white rounded-full w-10 flex items-center justify-center">
          <span class="text-sm font-bold">{{ currentUserInitials() }}</span>
        </div>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[50] p-2 shadow-2xl bg-[#0d1527] rounded-xl w-72 border border-[#1e293b] text-slate-200">
        <li class="px-4 py-3 border-b border-[#1e293b] mb-1">
          <div class="flex flex-col gap-0.5 max-w-full overflow-hidden p-0 bg-transparent">
            <span class="font-extrabold text-white text-sm truncate">{{ currentUser()?.username }}</span>
            <span class="text-xs text-slate-400 font-medium truncate block max-w-full" [title]="currentUser()?.email || ''">{{ currentUser()?.email }}</span>
          </div>
        </li>
        <li *ngIf="currentUserRoles().includes('ROLE_INVESTOR')">
          <a (click)="go('/investors/profile')" class="hover:bg-[#121c33] hover:text-white py-2.5 rounded-lg flex items-center gap-2.5 font-semibold text-slate-200"><i class="pi pi-briefcase text-[#a78bfa]"></i> Mi Perfil Inversor</a>
        </li>
        <li *ngIf="currentUserRoles().includes('ROLE_STUDENT')">
          <a (click)="go('/profile/student')" class="hover:bg-[#121c33] hover:text-white py-2.5 rounded-lg flex items-center gap-2.5 font-semibold text-slate-200"><i class="pi pi-book text-[#a78bfa]"></i> Mi Perfil Estudiante</a>
        </li>
        <li class="mt-1 border-t border-[#1e293b] pt-1">
          <a (click)="logout()" class="text-red-400 hover:bg-red-950/30 hover:text-red-300 py-2.5 rounded-lg flex items-center gap-2.5 font-semibold"><i class="pi pi-sign-out text-red-400"></i> Cerrar Sesión</a>
        </li>
      </ul>
    </div>

    <!-- 🔑 Login / Register Buttons (if visitor NOT logged in) -->
    <div class="flex items-center gap-2" *ngIf="!currentUser()">
      <a routerLink="/auth/login" class="px-3.5 py-1.5 text-xs font-semibold text-slate-300 hover:text-white transition">
        Iniciar Sesión
      </a>
      <a routerLink="/auth/register" class="px-4 py-2 rounded-xl text-xs font-bold bg-[#7c3aed] hover:bg-[#6d28d9] text-white shadow-md shadow-purple-600/20 transition-all">
        Registrarse
      </a>
    </div>

  </div>
</div>

<div class="layout" [class.no-sidebar]="!hasSidebar()" [class.collapsed]="sidebarCollapsed()">
  <aside class="sidebar bg-[#090f1d] border-r border-[#1e293b] flex flex-col justify-between" *ngIf="hasSidebar()">
    <ul class="menu menu-md w-full p-3 gap-1.5 flex-1">
      <ng-container *ngFor="let item of sideModel">
        <li>
          <a [routerLink]="item.routerLink" 
             routerLinkActive="active bg-[#7c3aed]/20 text-[#a78bfa] font-bold border-l-4 border-[#7c3aed]" 
             class="flex items-center gap-3 py-2.5 px-3 rounded-xl font-medium text-slate-300 hover:bg-[#0d1527] hover:text-white transition-colors">
            <i [class]="item.icon + ' text-lg text-[#a78bfa]'"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ng-container>
    </ul>
  </aside>

  <main class="content bg-[#030712] text-white">
    <router-outlet></router-outlet>
  </main>
</div>
<app-chatbot></app-chatbot>
