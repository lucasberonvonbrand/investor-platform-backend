<main class="min-h-screen flex bg-[#030712] text-white">
  <div class="flex flex-col md:flex-row w-full min-h-screen">
    <!-- Left Pane: Role Selection -->
    <div class="flex flex-col justify-center p-8 md:p-16 lg:p-24 w-full md:w-1/2 bg-[#090f1d]">
      <div class="max-w-md w-full mx-auto text-left">
        <a class="inline-block mb-8 hover:opacity-90 transition-opacity" routerLink="/landing">
          <img src="assets/images/ProyplusTransparente.png" alt="Proy+" class="h-16 w-auto invert object-contain" />
        </a>

        <h1 class="text-4xl font-bold text-white mb-2 tracking-tight">Crear una Cuenta</h1>
        <p class="text-slate-400 mb-8">Para continuar, elegí tu tipo de perfil:</p>

        <div class="flex flex-col gap-5">
          <!-- Student Card -->
          <a routerLink="/students/register"
             class="group flex items-center gap-5 p-5 bg-[#0d1527] rounded-2xl border border-[#1e293b] hover:border-[#7c3aed] hover:bg-[#121c33] transition-all duration-200">
            <div class="w-14 h-14 rounded-xl bg-cyan-500/10 flex items-center justify-center flex-none group-hover:scale-105 transition-transform">
              <i class="pi pi-user text-2xl text-cyan-400"></i>
            </div>
            <div class="flex flex-col">
              <span class="text-lg font-bold text-white group-hover:text-[#a78bfa] transition-colors">Soy Estudiante</span>
              <span class="text-xs text-slate-400 mt-0.5">Quiero registrar mis proyectos y conseguir financiamiento</span>
            </div>
            <i class="pi pi-chevron-right ml-auto text-slate-500 group-hover:text-white transition-colors"></i>
          </a>

          <!-- Investor Card -->
          <a routerLink="/investors/register"
             class="group flex items-center gap-5 p-5 bg-[#0d1527] rounded-2xl border border-[#1e293b] hover:border-[#7c3aed] hover:bg-[#121c33] transition-all duration-200">
            <div class="w-14 h-14 rounded-xl bg-purple-500/10 flex items-center justify-center flex-none group-hover:scale-105 transition-transform">
              <i class="pi pi-briefcase text-2xl text-purple-400"></i>
            </div>
            <div class="flex flex-col">
              <span class="text-lg font-bold text-white group-hover:text-[#a78bfa] transition-colors">Soy Inversor</span>
              <span class="text-xs text-slate-400 mt-0.5">Quiero explorar proyectos e invertir en emprendimientos</span>
            </div>
            <i class="pi pi-chevron-right ml-auto text-slate-500 group-hover:text-white transition-colors"></i>
          </a>
        </div>

        <div class="mt-10 text-sm text-slate-400">
          <p>¿Ya tenés una cuenta? <a routerLink="/auth/login" class="font-bold text-[#a78bfa] hover:underline ml-1">Iniciar sesión aquí</a></p>
        </div>
      </div>
    </div>

    <!-- Right Pane: Geometric Blue Pattern -->
    <div class="hidden md:block w-1/2 relative bg-[#090f1d] overflow-hidden">
      <div class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 hover:scale-105" 
           style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80')">
      </div>
      <div class="absolute inset-0 bg-gradient-to-r from-[#090f1d] via-transparent to-transparent"></div>
    </div>
  </div>
</main>
