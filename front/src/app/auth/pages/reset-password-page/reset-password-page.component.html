<!-- Error Modal -->
<app-auth-error-modal
  *ngIf="serverError()"
  [isOpen]="!!serverError()"
  [title]="'Could not reset password'"
  [message]="serverError()?.message || ''"
  (close)="serverError.set(null)">
</app-auth-error-modal>

<div class="min-h-screen grid place-items-center p-6 bg-gray-50 dark:bg-black">
  <div class="w-full max-w-md space-y-4">

    <!-- Token input -->
    <div class="rounded-xl border bg-white/90 dark:bg-gray-900/80 dark:border-gray-800 p-4 backdrop-blur">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Reset password</h2>

      <label class="block text-sm text-gray-600 dark:text-gray-300 mt-3">Token</label>
      <input
        type="text"
        [value]="token()"
        (input)="updateToken($event)"
        placeholder="Token from your email"
        class="mt-1 w-full border rounded-lg p-2 dark:bg-gray-800 dark:border-gray-700 text-gray-900 dark:text-white"
        autocomplete="off"
      />
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
        If you clicked the link in your email, the token will appear automatically.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()"
          class="rounded-xl border bg-white/90 dark:bg-gray-900/80 dark:border-gray-800 p-4 space-y-4 backdrop-blur">

      <div formGroupName="passwordGroup" class="space-y-4">
        <div class="relative">
          <label class="block text-sm text-gray-600 dark:text-gray-300">New password</label>
          <input
            [type]="masked() ? 'password' : 'text'"
            class="mt-1 w-full border rounded-lg p-3 pr-16 dark:bg-gray-800 dark:border-gray-700 text-gray-900 dark:text-white"
            formControlName="password"
            placeholder="Minimum 6 characters" />
          <button
            type="button"
            (click)="toggleMask(1)"
            class="absolute right-3 top-8 text-xs text-gray-600 dark:text-gray-300 hover:underline">
            {{ masked() ? 'Show' : 'Hide' }}
          </button>
          <p *ngIf="invalid(fPassword)" class="mt-1 text-xs text-red-600 dark:text-red-400">
            Password must be at least 6 characters.
          </p>
        </div>

        <div class="relative">
          <label class="block text-sm text-gray-600 dark:text-gray-300">Confirm password</label>
          <input
            [type]="masked2() ? 'password' : 'text'"
            class="mt-1 w-full border rounded-lg p-3 pr-16 dark:bg-gray-800 dark:border-gray-700 text-gray-900 dark:text-white"
            formControlName="confirm"
            placeholder="Repeat password" />
          <button
            type="button"
            (click)="toggleMask(2)"
            class="absolute right-3 top-8 text-xs text-gray-600 dark:text-gray-300 hover:underline">
            {{ masked2() ? 'Show' : 'Hide' }}
          </button>
          <p *ngIf="invalid(fConfirm)" class="mt-1 text-xs text-red-600 dark:text-red-400">
            Please repeat the password.
          </p>
          <p *ngIf="fGroup.errors?.['mismatch'] && (fConfirm.touched || fConfirm.dirty)"
             class="mt-1 text-xs text-red-600 dark:text-red-400">
            Passwords do not match.
          </p>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || loading() || !token()"
        class="w-full bg-indigo-600 text-white rounded-lg p-3 hover:bg-indigo-700 transition disabled:opacity-60">
        <span *ngIf="!loading()">Reset password</span>
        <span *ngIf="loading()">Processing…</span>
      </button>
    </form>

    <!-- Success -->
    <div *ngIf="success()" class="rounded-xl border bg-green-50 dark:bg-green-900/20 dark:border-green-900 p-4">
      <p class="text-sm text-green-700 dark:text-green-300">{{ successMsg() }}</p>
      <div class="mt-3">
        <button class="w-full bg-indigo-600 text-white rounded-lg p-3 hover:bg-indigo-700 transition" (click)="goToLogin()">
          Go to sign in
        </button>
      </div>
    </div>

    <div class="text-center text-sm">
      <a routerLink="/auth/login" class="underline text-indigo-600 hover:text-indigo-800">Back to sign in</a>
    </div>
  </div>
</div>
