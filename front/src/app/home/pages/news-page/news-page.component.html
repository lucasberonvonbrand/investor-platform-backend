<div class="max-w-7xl mx-auto p-4 md:p-8 min-h-screen">
  
  <div class="mb-10 text-center md:text-left">
    <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-2">
      Platform News & Updates
    </h1>
    <p class="text-lg text-slate-500 dark:text-slate-400">
      Stay informed with the latest trends in investments, technology, and market insights.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <article *ngFor="let news of newsList" class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 border border-slate-200 dark:border-slate-700 flex flex-col cursor-pointer group">
      
      <!-- Image Container -->
      <div class="relative h-48 overflow-hidden">
        <img [src]="news.imageUrl" [alt]="news.title" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
        <div class="absolute top-4 left-4">
          <span class="px-3 py-1 bg-indigo-600/90 backdrop-blur-sm text-white text-xs font-semibold uppercase tracking-wider rounded-full shadow-sm">
            {{ news.category }}
          </span>
        </div>
      </div>

      <!-- Content -->
      <div class="p-6 flex flex-col flex-grow">
        <div class="flex items-center text-xs text-slate-500 dark:text-slate-400 mb-3 gap-3">
          <span class="flex items-center gap-1"><i class="pi pi-calendar"></i> {{ news.date }}</span>
          <span class="flex items-center gap-1"><i class="pi pi-clock"></i> {{ news.readTime }}</span>
        </div>
        
        <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-3 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
          {{ news.title }}
        </h2>
        
        <p class="text-slate-600 dark:text-slate-400 text-sm flex-grow line-clamp-3">
          {{ news.summary }}
        </p>

        <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700 flex items-center text-indigo-600 dark:text-indigo-400 font-medium text-sm group-hover:underline">
          Read Full Article <i class="pi pi-arrow-right ml-2 text-xs"></i>
        </div>
      </div>
    </article>
  </div>

</div>
