<p-toast></p-toast>

<div class="w-full min-h-screen bg-[#030712] text-slate-100 p-4 lg:p-6">
  <div class="w-full space-y-4">

    <!-- Spinner Loading -->
    <div *ngIf="loading()" class="flex flex-col items-center justify-center py-24 text-slate-400">
      <i class="pi pi-spin pi-spinner text-5xl text-[#7c3aed] mb-4"></i>
      <span class="text-lg font-medium">Cargando detalles del proyecto...</span>
    </div>

    <ng-container *ngIf="!loading() && project()">
      <!-- Main Full-Width Card (Toolbar + Header + Tabs + Content ALL IN ONE) -->
      <div class="w-full bg-[#0d1527] border border-[#1e293b] rounded-2xl shadow-xl p-6 lg:p-8 space-y-6">
        
        <!-- Top Toolbar Header Row: Back button + Action buttons -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-[#1e293b]">
          <button type="button" class="btn btn-ghost text-slate-300 hover:text-white hover:bg-[#121c33] rounded-xl gap-2 font-semibold self-start border border-[#1e293b] px-4 py-2" (click)="goBack()">
            <i class="pi pi-arrow-left text-[#a78bfa]"></i> Volver a Proyectos
          </button>
          
          <div class="flex items-center gap-3">
            <button *ngIf="isInvestor()" type="button" class="btn btn-warning rounded-xl gap-2 font-semibold shadow-lg" (click)="goToRiskAnalysis()" [disabled]="!project()">
              <i class="pi pi-shield"></i> Análisis de Riesgo con IA
            </button>
            <button *ngIf="!isOwner()" type="button" class="btn btn-primary bg-[#7c3aed] hover:bg-[#6d28d9] border-none text-white rounded-xl gap-2 font-semibold shadow-lg" (click)="contactOwner()" [disabled]="!project()">
              <i class="pi pi-envelope"></i> Contactar Creador
            </button>
          </div>
        </div>

        <!-- Project Hero Header -->
        <div class="flex flex-col lg:flex-row lg:justify-between lg:items-start gap-4">
          <div>
            <div class="flex items-center gap-3 flex-wrap">
              <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">{{ project()?.title }}</h1>
              <span class="badge bg-[#7c3aed]/20 text-[#a78bfa] border-[#7c3aed]/40 font-bold text-sm px-3 py-1">#{{ project()?.id }}</span>
            </div>
            <p class="text-slate-400 mt-2 text-base sm:text-lg max-w-5xl leading-relaxed">{{ project()?.summary }}</p>
          </div>
        </div>
        
        <!-- Tabs Navigation -->
        <div class="flex space-x-2 border-b border-[#1e293b] pt-2">
          <button type="button" (click)="setTab('overview')"
                  [ngClass]="activeTab() === 'overview' ? 'border-[#7c3aed] text-[#a78bfa] font-bold bg-[#7c3aed]/10' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-[#121c33]'"
                  class="whitespace-nowrap py-3 px-5 border-b-2 rounded-t-xl text-sm flex items-center gap-2 transition-all cursor-pointer">
            <i class="pi pi-info-circle"></i> Información General
          </button>
          
          <button type="button" (click)="setTab('contracts')"
                  [ngClass]="activeTab() === 'contracts' ? 'border-[#7c3aed] text-[#a78bfa] font-bold bg-[#7c3aed]/10' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-[#121c33]'"
                  class="whitespace-nowrap py-3 px-5 border-b-2 rounded-t-xl text-sm flex items-center gap-2 transition-all cursor-pointer">
            <i class="pi pi-file-edit"></i> Contratos e Inversiones
          </button>
        </div>

        <!-- Active Tab Content Area (Directly inside main card) -->
        <div class="pt-2">
          <div *ngIf="activeTab() === 'overview'">
            <app-project-overview [project]="project()" [isOwner]="isOwner()"></app-project-overview>
          </div>

          <div *ngIf="activeTab() === 'contracts'">
            <app-project-contracts [project]="project()" [isOwner]="isOwner()" [isInvestor]="isInvestor()"></app-project-contracts>
          </div>
        </div>
      </div>
    </ng-container>
    
    <!-- Not Found -->
    <div *ngIf="!loading() && !project()" class="bg-[#0d1527] border border-[#1e293b] rounded-2xl p-12 text-center shadow-xl">
      <i class="pi pi-exclamation-triangle text-6xl text-warning mb-4"></i>
      <h2 class="text-2xl font-bold text-white">Proyecto no encontrado</h2>
      <p class="text-slate-400 mt-2">El proyecto que estás buscando no existe o ha sido eliminado.</p>
      <button type="button" class="btn btn-primary bg-[#7c3aed] hover:bg-[#6d28d9] rounded-xl mt-6 gap-2" (click)="goBack()">
        <i class="pi pi-arrow-left"></i> Volver a Proyectos
      </button>
    </div>
  </div>
</div>
