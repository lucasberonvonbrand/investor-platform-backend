<p-toast></p-toast>
<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col" style="height: 600px;">
  <div class="p-4 border-b border-gray-200 dark:border-gray-700 font-semibold text-lg flex items-center gap-2 text-gray-900 dark:text-white">
    <i class="pi pi-comments text-indigo-500"></i> Project Discussion
  </div>
  
  <div #chatScroll class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-gray-50 dark:bg-gray-900/50">
    <div *ngIf="messages().length === 0" class="text-center text-gray-500 dark:text-gray-400 mt-10">
      <i class="pi pi-inbox text-4xl mb-3 opacity-50"></i>
      <p>No messages yet. Start the conversation!</p>
    </div>

    <div *ngFor="let msg of messages()" class="flex flex-col max-w-[80%]" [ngClass]="{'self-end': isMe(msg.authorId), 'self-start': !isMe(msg.authorId)}">
      <span class="text-xs text-gray-500 dark:text-gray-400 mb-1 mx-1" [ngClass]="{'text-right': isMe(msg.authorId)}">
        {{ msg.authorName }} • {{ msg.createdAt | date:'shortTime' }}
      </span>
      <div class="p-3 rounded-2xl shadow-sm"
           [ngClass]="isMe(msg.authorId) ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-200 dark:border-gray-700 rounded-tl-none'">
        {{ msg.message }}
      </div>
    </div>
  </div>
  
  <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 rounded-b-xl flex gap-2">
    <input pInputText type="text"
           class="flex-1 border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-gray-900 dark:text-white" 
           placeholder="Type a message..."
           [ngModel]="newMessage()"
           (ngModelChange)="newMessage.set($event)"
           (keyup.enter)="sendMessage()" />
    <p-button icon="pi pi-send" 
              (click)="sendMessage()" 
              [disabled]="!newMessage().trim() || isSending()"
              [loading]="isSending()"></p-button>
  </div>
</div>
