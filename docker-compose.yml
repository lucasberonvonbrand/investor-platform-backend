services:
  # 1. Base de Datos MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: proyplus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: gestor_inversores
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-1234}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend Spring Boot (Java 17)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyplus-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gestor_inversores?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-1234}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      DB_URL: jdbc:mysql://mysql:3306/gestor_inversores?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-lucas}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-1234}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ebd0fa26534e4af21e88da31d0c9f4307d974d1f79b8b58a57a00367b158e0fd}
      JWT_USER_GENERATOR: ${JWT_USER_GENERATOR:-PROYPLUS202-SEC}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-your-exchange-rate-api-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your-gemini-api-key}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Frontend Angular 19
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: proyplus-frontend
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  db_data:
  backend_uploads:
